<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏳</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    
    <!-- SEO Meta Tags -->
    <title>Gotta-do-it | Premium Futuristic Productivity Dashboard</title>
    <meta name="description" content="Ultra-premium monochrome productivity. Focus, organize, and accomplish your goals in an Apple + Notion + Linear inspired environment." />
    <meta name="keywords" content="productivity, focus, goals, organizer, minimal, elegant, apple design, linear app, task manager, dashboard" />
    <meta name="author" content="Gotta-do-it Team" />
    
    <!-- Google Fonts: Outfit (main headings & body) + Space Mono (numerical widgets & technical details) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    
    <script>
      (function () {
        var t = localStorage.getItem('gdi-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        overflow-y: scroll;
        height: auto;
      }
      body {
        overflow-y: visible;
        min-height: 100dvh;
      }
      html[data-theme='dark'], html[data-theme='dark'] body {
        background-color: #000000;
        color: #ffffff;
      }
      html[data-theme='light'], html[data-theme='light'] body {
        background-color: #fafafa;
        color: #0a0a0a;
      }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
